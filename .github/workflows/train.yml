# Start the training on Kaggle's free GPU from GitHub (Actions → Train on Kaggle → Run workflow).
# Needs the repository secret KAGGLE_API_TOKEN (Kaggle → Settings → API → Generate New Token).
name: Train on Kaggle

on:
  workflow_dispatch:
    inputs:
      action:
        description: "train = start a new training run; fetch = only collect the last run's results"
        type: choice
        options: [train, fetch]
        default: train
      train_set:
        description: "v2 = real-data training set (main model); v1 = the first 400 made-up examples (comparison); v4 = 6,000 rows as speech-to-text writes them (own notebook wimb-shop-model-training-v4, about 2-2.5 h)"
        type: choice
        options: [v2, v1, v4]
        default: v2
      export_gguf:
        description: "Export and test the Ollama file (not needed for a comparison run)"
        type: choice
        options: ["yes", "no"]
        default: "yes"

permissions:
  contents: read

# One run at a time: two runs of the same Kaggle notebook would mix up their results.
concurrency:
  group: kaggle-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    # v4 trains about 1 hour (6,151 rows, 2 epochs): the whole run takes about 2-2.5 hours
    timeout-minutes: ${{ inputs.train_set == 'v4' && 330 || 150 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Check the Kaggle token
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::error::Add the secret KAGGLE_API_TOKEN: https://github.com/${{ github.repository }}/settings/secrets/actions/new"
            exit 1
          fi
      - name: Train on Kaggle (about 45 minutes; v4 about 2-2.5 hours) or collect the last run
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          ACTION: ${{ inputs.action }}
          TRAIN_SET: ${{ inputs.train_set }}
          EXPORT_GGUF: ${{ inputs.export_gguf }}
        run: |
          ARGS="--train-set $TRAIN_SET"
          if [ "$EXPORT_GGUF" = "no" ]; then ARGS="$ARGS --no-gguf"; fi
          if [ "$ACTION" = "fetch" ]; then ARGS="$ARGS --wait"; fi
          python run_on_kaggle.py $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaggle-output
          path: kaggle_output/
          if-no-files-found: ignore
