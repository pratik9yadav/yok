# Download real data from open sources (Kaggle, Hugging Face) and save it on a branch for review.
# This repo's Claude container cannot reach those sites; a GitHub runner can.
name: Fetch real data

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "products = Kaggle product lists; indicvoices = AI4Bharat transcripts (needs the HF_TOKEN secret); all = both"
        type: choice
        options: [all, products, indicvoices]
        default: all

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt pyarrow huggingface_hub
      - run: python -m pytest -q
      - name: Fetch
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCES: ${{ inputs.sources }}
        run: python fetch_real_data.py "$SOURCES"
      - name: Save the results on a review branch (never straight to main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/real
          if git diff --cached --quiet; then echo "Nothing new was fetched."; exit 0; fi
          git commit -q -m "Fetched real data (run ${{ github.run_id }})"
          git push origin "HEAD:refs/heads/real-data/run-${{ github.run_id }}"
          echo "Saved on branch real-data/run-${{ github.run_id }}"
